# Builds the single-container image (API that also processes files) for
# Cloud Run. Used by deploy/cloudrun/setup.sh; run from backend/.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.cloudrun", "-t", "${_IMAGE}", "."]
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: ""
options:
  logging: CLOUD_LOGGING_ONLY
