# Render Blueprint: the PruFlo API and worker on the free plan.
# Render dashboard → New → Blueprint → this repository. Secrets marked
# "sync: false" are asked for once in the dashboard and never stored here.
services:
  - type: web
    name: pruflo-api
    runtime: docker
    plan: free
    region: virginia
    branch: main  # production: merges to main deploy
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PRUFLO_ENV
        value: prod
      - key: PRUFLO_REGION
        value: us-east1
      - key: PRUFLO_STORAGE_BACKEND
        value: firestore
      - key: PRUFLO_QUEUE_BACKEND
        value: inline
      # The Firebase project (sign-in, push, Firestore); asked for once.
      - key: PRUFLO_FIREBASE_PROJECT
        sync: false
      - key: PRUFLO_GEMINI_ENABLED
        value: "true"
      # No reCAPTCHA site key yet; turn on once the web app sends App Check tokens.
      - key: PRUFLO_APP_CHECK_REQUIRED
        value: "false"
      - key: PRUFLO_DB_POOL_SIZE
        value: "3"
      - key: PRUFLO_DB_MAX_OVERFLOW
        value: "2"
      # Secrets. PRUFLO_SECRETS_KEY must be a Fernet key (Docs/deployment.md
      # shows how to make one); Render's generated values aren't valid ones.
      - key: PRUFLO_SECRETS_KEY
        sync: false
      - key: PRUFLO_STORAGE_SIGNING_KEY
        generateValue: true
      # Copy this value into the GitHub secret PRUFLO_TICK_TOKEN (tick.yml).
      - key: PRUFLO_TICK_TOKEN
        generateValue: true
      # Secrets you paste in the dashboard.
      - key: PRUFLO_DATABASE_URL
        sync: false
      - key: PRUFLO_MIGRATION_DATABASE_URL
        sync: false
      - key: PRUFLO_FIREBASE_CREDENTIALS
        sync: false
      - key: PRUFLO_GEMINI_API_KEY
        sync: false
