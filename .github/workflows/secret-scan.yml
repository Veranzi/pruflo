name: Secret scan

# Fails the run if a commit adds a password, API key, private key or similar.
# Secrets belong in GitHub secrets/variables or Secret Manager, never in git.
on:
  pull_request:
  push:
    branches: [main, frontend, backend]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan new commits for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
